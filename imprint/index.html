<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cover Layout — Pocket Book Hard Cover</title>
    <style>
      :root {
        --ink: #22262f;
        --ink-soft: #6a7080;
        --bg: #e9eaec;
        --panel: #ffffff;
        --line: #d9dbe0;
        --trim: #e5397e; /* echoes template trim line */
        --bleed: #4c9fe0; /* echoes template bleed line */
        --safety: #69b97e; /* echoes template safety line */
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- top bar ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-right: 6px;
      }
      .brand .dots {
        display: flex;
        gap: 4px;
      }
      .brand .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: block;
      }
      .brand .dots i:nth-child(1) {
        background: var(--bleed);
      }
      .brand .dots i:nth-child(2) {
        background: var(--trim);
      }
      .brand .dots i:nth-child(3) {
        background: var(--safety);
      }
      .brand h1 {
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .brand span {
        font-size: 11px;
        color: var(--ink-soft);
        letter-spacing: 0.05em;
      }
      .bar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .spacer {
        flex: 1;
      }
      button,
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background: #f3f4f6;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:hover,
      .btn:hover {
        background: #eceef1;
      }
      button.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      button.primary:hover {
        background: #333947;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--trim);
        outline-offset: 1px;
      }
      label.toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      label.toggle input {
        accent-color: var(--trim);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .zoom {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-soft);
      }
      .zoom input[type="range"] {
        width: 120px;
        accent-color: var(--ink);
      }
      .zoom output {
        min-width: 38px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- layout ---------- */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #stageWrap {
        flex: 1;
        overflow: auto;
        position: relative;
        background:
          radial-gradient(circle at 1px 1px, #d3d5da 1px, transparent 1.5px) 0
            0/22px 22px,
          var(--bg);
      }
      #stageOuter {
        min-width: 100%;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      #stage {
        position: relative;
        background: #fff;
        box-shadow:
          0 2px 6px rgba(30, 34, 44, 0.12),
          0 14px 34px rgba(30, 34, 44, 0.14);
        touch-action: none;
        flex: none;
      }
      #stage.drop-hint::after {
        content: "Drop images to place them";
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(76, 159, 224, 0.12);
        border: 2px dashed var(--bleed);
        font-size: 15px;
        font-weight: 600;
        color: var(--bleed);
        pointer-events: none;
        z-index: 60;
      }
      #tplOverlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 40;
        user-select: none;
      }
      .el {
        position: absolute;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      .el:active {
        cursor: grabbing;
      }
      .el img {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      .el .txt {
        white-space: pre;
        line-height: 1.25;
        pointer-events: none;
        width: 100%;
        height: 100%;
      }

      /* selection chrome */
      #selBox {
        position: absolute;
        z-index: 50;
        pointer-events: none;
      }
      #selBox .frame {
        position: absolute;
        inset: 0;
        border: 1.5px solid var(--trim);
      }
      .handle {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #fff;
        border: 2px solid var(--trim);
        border-radius: 3px;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .handle.tl {
        left: 0;
        top: 0;
        cursor: nwse-resize;
      }
      .handle.tr {
        left: 100%;
        top: 0;
        cursor: nesw-resize;
      }
      .handle.bl {
        left: 0;
        top: 100%;
        cursor: nesw-resize;
      }
      .handle.br {
        left: 100%;
        top: 100%;
        cursor: nwse-resize;
      }
      .handle.rot {
        left: 50%;
        top: -26px;
        border-radius: 50%;
        cursor: grab;
        background: var(--trim);
        border-color: #fff;
      }
      #selBox .stem {
        position: absolute;
        left: 50%;
        top: -26px;
        width: 1.5px;
        height: 26px;
        background: var(--trim);
        transform: translateX(-50%);
      }

      /* ---------- sidebar ---------- */
      aside {
        width: 288px;
        flex: none;
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      aside h2 {
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 8px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .row label {
        font-size: 12px;
        color: var(--ink-soft);
        min-width: 56px;
      }
      .row input[type="number"] {
        width: 64px;
      }
      input[type="number"],
      select,
      textarea,
      input[type="text"] {
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 8px;
        background: #fff;
        color: var(--ink);
      }
      select {
        flex: 1;
        min-width: 0;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 64px;
        line-height: 1.4;
      }
      input[type="color"] {
        width: 34px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 2px;
        background: #fff;
        cursor: pointer;
      }
      input[type="range"] {
        flex: 1;
        accent-color: var(--ink);
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        border: none;
        border-radius: 0;
        background: #fff;
        padding: 6px 10px;
        flex: 1;
        font-weight: 700;
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button.on {
        background: var(--ink);
        color: #fff;
      }
      .mini-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .mini-actions button {
        justify-content: center;
      }
      button.danger {
        color: #c22743;
        border-color: #f0c4cd;
        background: #fdf3f5;
      }
      button.danger:hover {
        background: #fbe6ea;
      }
      .hint {
        font-size: 12px;
        color: var(--ink-soft);
        line-height: 1.55;
      }
      .hint kbd {
        background: #f0f1f3;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 11px;
        font-family: inherit;
      }
      .radio-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13px;
      }
      .radio-list label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
        line-height: 1.35;
      }
      .radio-list input {
        accent-color: var(--trim);
        margin-top: 2px;
      }
      .radio-list small {
        display: block;
        color: var(--ink-soft);
      }
      @media (max-width: 760px) {
        main {
          flex-direction: column;
        }
        aside {
          width: 100%;
          border-left: none;
          border-top: 1px solid var(--line);
          max-height: 45%;
        }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dots"><i></i><i></i><i></i></span>
        <div>
          <h1>Cover Layout</h1>
          <span>Pocket book · hard cover template</span>
        </div>
      </div>
      <div class="bar-group">
        <button class="primary" id="btnAddImage">+ Image</button>
        <button id="btnAddText">+ Text</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
      <div class="spacer"></div>
      <label class="toggle"
        ><input type="checkbox" id="tplToggle" checked /> Show template
        guides</label
      >
      <button
        id="btnTplUpload"
        title="Load a custom template overlay (image or PDF)"
      >
        Custom template
      </button>
      <button
        id="btnTplReset"
        hidden
        title="Restore the built-in template guides"
      >
        Reset template
      </button>
      <input
        type="file"
        id="tplFileInput"
        accept="image/*,application/pdf"
        hidden
      />
      <div class="zoom">
        <span>Zoom</span>
        <input
          type="range"
          id="zoomRange"
          min="50"
          max="250"
          value="100"
          step="5"
        />
        <output id="zoomOut">100%</output>
      </div>
    </header>

                <option value="Verdana, Geneva, sans-serif">Verdana</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
                <option value="Futura, 'Century Gothic', sans-serif">
                  Futura / Century Gothic
                </option>
                <option value="Impact, 'Arial Black', sans-serif">
                  Impact
                </option>
                <option value="'Courier New', monospace">Courier</option>
                <option value="'Brush Script MT', cursive">Brush Script</option>
              </select>
            </div>
            <div class="row">
              <label>Size (pt)</label>
              <input type="number" id="tSize" min="6" max="300" step="1" />
              <input type="color" id="tColor" title="Text color" />
            </div>
            <div class="row">
              <label>Style</label>
              <div class="seg" style="flex: 1">
                <button id="tBold" title="Bold">B</button>
                <button id="tItalic" title="Italic" style="font-style: italic">
                  I
                </button>
              </div>
            </div>
            <div class="row">
              <label>Align</label>
              <div class="seg" style="flex: 1">
                <button data-align="left">⟸</button>
                <button data-align="center">≡</button>
                <button data-align="right">⟹</button>
              </div>
            </div>
          </div>

          <div class="panel" id="propsImage" hidden>
            <div class="row">
              <label>Opacity</label>
              <input
                type="range"
                id="iOpacity"
                min="10"
                max="100"
                value="100"
              />
            </div>
          </div>

          <div class="panel" id="propsCommon" hidden style="margin-top: 10px">
            <div class="row">
              <label>Rotation</label>
              <input type="number" id="cRot" step="1" style="width: 70px" /> °
              <button id="cRot90" title="Rotate 90° — handy for spine text">
                ⟳ 90°
              </button>
            </div>
            <div class="mini-actions" style="margin-top: 4px">
              <button id="cForward">Bring forward</button>
              <button id="cBackward">Send back</button>
              <button id="cDup">Duplicate</button>
              <button id="cDel" class="danger">Delete</button>
            </div>
          </div>
        </section>

        <section>
          <h2>Export</h2>
          <div class="panel">
            <div class="radio-list" style="margin-bottom: 12px">
              <label
                ><input type="radio" name="expMode" value="guides" />
                <span
                  >With template guides<small
                    >For checking placement</small
                  ></span
                ></label
              >
              <label
                ><input type="radio" name="expMode" value="white" checked />
                <span
                  >Design only · white background<small
                    >Print-ready, no guide lines</small
                  ></span
                ></label
              >
              <label
                ><input type="radio" name="expMode" value="transparent" />
                <span
                  >Design only · transparent<small>PNG with alpha</small></span
                ></label
              >
            </div>
            <div class="row">
              <label>Resolution</label>
              <select id="expDpi">
                <option value="150">150 DPI (preview)</option>
                <option value="300" selected>300 DPI (print)</option>
              </select>
            </div>
            <div class="row">
              <label>Format</label>
              <div class="seg" style="flex: 1">
                <button id="fmtPng" class="on" data-fmt="png">PNG</button>
                <button id="fmtPdf" data-fmt="pdf">PDF</button>
              </div>
            </div>
            <button
              class="primary"
              id="btnExport"
              style="width: 100%; justify-content: center; margin-top: 4px"
            >
              Download PNG
            </button>
            <p class="hint" style="margin-top: 9px" id="expInfo"></p>
          </div>
        </section>
      </aside>
    </main>

    <script>
      (function () {
        "use strict";
        /* ---------- constants ---------- */
        const PT_W = 780.552,
          PT_H = 603; // template page size in points
        const MIN_SIZE = 8; // pt
        const LINE_H = 1.25;

        /* ---------- state ---------- */
        let elements = []; // {id,type,x,y,w,h,rot, ...}
        let selId = null;
        let zoom = 1,
          fitScale = 1;
        let uid = 0;

        /* ---------- dom ---------- */
        const stage = document.getElementById("stage");
        const stageWrap = document.getElementById("stageWrap");
        const tplOverlay = document.getElementById("tplOverlay");
        const selBox = document.getElementById("selBox");
        const fileInput = document.getElementById("fileInput");
        const nodes = new Map(); // id -> dom node

        const $ = (id) => document.getElementById(id);
        const measCtx = document.createElement("canvas").getContext("2d");

        function scale() {
          return fitScale * zoom;
        }
        function sel() {
          return elements.find((e) => e.id === selId) || null;
        }

        /* ---------- stage sizing ---------- */
        function layoutStage() {
          const pad = 56;
          const availW = stageWrap.clientWidth - pad;
          const availH = stageWrap.clientHeight - pad;
          fitScale = Math.max(0.05, Math.min(availW / PT_W, availH / PT_H));
          const s = scale();
          stage.style.width = PT_W * s + "px";
          stage.style.height = PT_H * s + "px";
          elements.forEach(syncNode);
          syncSelBox();
        }
        new ResizeObserver(layoutStage).observe(stageWrap);

        $("zoomRange").addEventListener("input", (e) => {
          zoom = e.target.value / 100;
          $("zoomOut").textContent = e.target.value + "%";
          layoutStage();
        });
        $("tplToggle").addEventListener("change", (e) => {
          tplOverlay.style.display = e.target.checked ? "" : "none";
        });

        /* ---------- custom template overlay ---------- */
        const tplOrigSrc = tplOverlay.src;
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        $("btnTplUpload").addEventListener("click", () =>
          $("tplFileInput").click(),
        );
        $("btnTplReset").addEventListener("click", () => {
          tplOverlay.src = tplOrigSrc;
          $("btnTplReset").hidden = true;
          $("tplToggle").checked = true;
          tplOverlay.style.display = "";
        });
        $("tplFileInput").addEventListener("change", async () => {
          const file = $("tplFileInput").files[0];
          if (!file) return;
          $("tplFileInput").value = "";

          let dataUrl;
          if (file.type === "application/pdf") {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 1 });
            const cv = document.createElement("canvas");
            const scale = Math.max(PT_W / vp.width, PT_H / vp.height);
            cv.width = Math.round(vp.width * scale);
            cv.height = Math.round(vp.height * scale);
            await page.render({
              canvasContext: cv.getContext("2d"),
              viewport: page.getViewport({ scale }),
            }).promise;
            dataUrl = cv.toDataURL("image/png");
          } else {
            dataUrl = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.onerror = rej;
              r.readAsDataURL(file);
            });
          }

          tplOverlay.src = dataUrl;
          $("btnTplReset").hidden = false;
          $("tplToggle").checked = true;
          tplOverlay.style.display = "";
        });

        /* ---------- text measurement ---------- */
        function fontString(el, sizeOverride) {
          return (
            (el.italic ? "italic " : "") +
            (el.bold ? "700 " : "400 ") +
            (sizeOverride || el.fontSize) +
            "px " +
            el.fontFamily
          );
        }
        function measureTextEl(el) {
          measCtx.font = fontString(el);
          const lines = el.text.split("\n");
          let w = 0;
          for (const ln of lines)
            w = Math.max(w, measCtx.measureText(ln).width);
          return {
            w: Math.max(w, 12),
            h: Math.max(
              lines.length * el.fontSize * LINE_H,
              el.fontSize * LINE_H,
            ),
          };
        }

        /* ---------- element creation ---------- */
        function addImageFromFile(file, dropPt) {
          if (!file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxW = PT_W * 0.34,
                maxH = PT_H * 0.6;
              const k = Math.min(
                maxW / img.naturalWidth,
                maxH / img.naturalHeight,
                1.5,
              );
              const w = img.naturalWidth * k,
                h = img.naturalHeight * k;
              const cx = dropPt ? dropPt.x : PT_W * 0.75; // default: centre of front cover
              const cy = dropPt ? dropPt.y : PT_H * 0.5;
              const el = {
                id: ++uid,
                type: "image",
                src: reader.result,
                _img: img,
                x: cx - w / 2,
                y: cy - h / 2,
                w,
                h,
                rot: 0,
                opacity: 1,
              };
              elements.push(el);
              buildNode(el);
              select(el.id);
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        }

        function addText() {
          const el = {
            id: ++uid,
            type: "text",
            text: "New text",
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 28,
            color: "#22262f",
            bold: false,
            italic: false,
            align: "left",
            x: 0,
            y: 0,
            w: 0,
            h: 0,
            rot: 0,
          };
          const m = measureTextEl(el);
          el.w = m.w;
          el.h = m.h;
          el.x = PT_W * 0.75 - el.w / 2;
          el.y = PT_H * 0.45 - el.h / 2;
          elements.push(el);
          buildNode(el);
          select(el.id);
          $("tText").focus();
          $("tText").select();
        }

        /* ---------- dom sync ---------- */
        function buildNode(el) {
          const n = document.createElement("div");
          n.className = "el";
          n.dataset.id = el.id;
          if (el.type === "image") {
            const im = document.createElement("img");
            im.src = el.src;
            im.draggable = false;
            n.appendChild(im);
          } else {
            const t = document.createElement("div");
            t.className = "txt";
            n.appendChild(t);
          }
          stage.appendChild(n);
          nodes.set(el.id, n);
          syncNode(el);
        }
        function syncNode(el) {
          const n = nodes.get(el.id);
          if (!n) return;
          const s = scale();
          n.style.left = el.x * s + "px";
          n.style.top = el.y * s + "px";
          n.style.width = el.w * s + "px";
          n.style.height = el.h * s + "px";
          n.style.transform = "rotate(" + el.rot + "deg)";
          n.style.zIndex = elements.indexOf(el) + 1;
          if (el.type === "image") {
            n.style.opacity = el.opacity;
          } else {
            const t = n.firstChild;
            t.textContent = el.text;
            t.style.font = fontString(el, el.fontSize * s);
            t.style.lineHeight = LINE_H;
            t.style.color = el.color;
            t.style.textAlign = el.align;
          }
        }
        function removeNode(id) {
          const n = nodes.get(id);
          if (n) n.remove();
          nodes.delete(id);
        }

        /* ---------- selection ---------- */
        function select(id) {
          selId = id;
          syncSelBox();
          refreshSidebar();
        }
        function syncSelBox() {
          const el = sel();
          if (!el) {
            selBox.hidden = true;
            return;
          }
          const s = scale();
          selBox.hidden = false;
          selBox.style.left = el.x * s + "px";
          selBox.style.top = el.y * s + "px";
          selBox.style.width = el.w * s + "px";
          selBox.style.height = el.h * s + "px";
          selBox.style.transform = "rotate(" + el.rot + "deg)";
        }

        /* ---------- pointer interactions ---------- */
        let drag = null;

        function stagePt(ev) {
          const r = stage.getBoundingClientRect();
          const s = scale();
          return { x: (ev.clientX - r.left) / s, y: (ev.clientY - r.top) / s };
        }
        const rotV = (v, deg) => {
          const a = (deg * Math.PI) / 180,
            c = Math.cos(a),
            si = Math.sin(a);
          return { x: v.x * c - v.y * si, y: v.x * si + v.y * c };
        };

        stage.addEventListener("pointerdown", (ev) => {
          const h = ev.target.closest(".handle");
          const el = sel();
          if (h && el) {
            ev.preventDefault();
            ev.stopPropagation();
            startHandleDrag(ev, el, h.dataset.h);
            return;
          }
          const n = ev.target.closest(".el");
          if (n) {
            ev.preventDefault();
            const id = +n.dataset.id;
            if (id !== selId) select(id);
            const e2 = sel();
            drag = { mode: "move", start: stagePt(ev), x0: e2.x, y0: e2.y };
            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", endDrag, { once: true });
          } else {
            select(null);
          }
        });

        function startHandleDrag(ev, el, which) {
          if (which === "rot") {
            drag = { mode: "rot" };
          } else {
            const sx = which.includes("r") ? 1 : -1; // dragged corner sign
            const sy = which.includes("b") ? 1 : -1;
            const cx = el.x + el.w / 2,
              cy = el.y + el.h / 2;
            const fixedLocal = { x: (-sx * el.w) / 2, y: (-sy * el.h) / 2 };
            const fw = rotV(fixedLocal, el.rot);
            drag = {
              mode: "resize",
              sx,
              sy,
              fixed: { x: cx + fw.x, y: cy + fw.y },
              w0: el.w,
              h0: el.h,
              fs0: el.fontSize || 0,
            };
          }
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", endDrag, { once: true });
        }

        function onMove(ev) {
          const el = sel();
          if (!el || !drag) return;
          const p = stagePt(ev);

          if (drag.mode === "move") {
            el.x = drag.x0 + (p.x - drag.start.x);
            el.y = drag.y0 + (p.y - drag.start.y);
          } else if (drag.mode === "rot") {
            const cx = el.x + el.w / 2,
              cy = el.y + el.h / 2;
            let deg = (Math.atan2(p.y - cy, p.x - cx) * 180) / Math.PI + 90;
            const snap = Math.round(deg / 15) * 15;
            if (Math.abs(deg - snap) < 3) deg = snap;
            el.rot = ((deg % 360) + 360) % 360;
            if (el.rot > 180) el.rot -= 360;
            $("cRot").value = Math.round(el.rot);
          } else {
            // resize
            const v = { x: p.x - drag.fixed.x, y: p.y - drag.fixed.y };
            const local = rotV(v, -el.rot);
            let nw = Math.max(MIN_SIZE, local.x * drag.sx);
            let nh = Math.max(MIN_SIZE, local.y * drag.sy);
            // uniform scale (images keep aspect; text scales font size)
            const k = Math.max(nw / drag.w0, nh / drag.h0);
            if (el.type === "text") {
              el.fontSize = Math.max(6, Math.round(drag.fs0 * k * 10) / 10);
              const m = measureTextEl(el);
              nw = m.w;
              nh = m.h;
              $("tSize").value = Math.round(el.fontSize);
            } else {
              nw = Math.max(MIN_SIZE, drag.w0 * k);
              nh = Math.max(MIN_SIZE, drag.h0 * k);
            }
            const cw = rotV(
              { x: (drag.sx * nw) / 2, y: (drag.sy * nh) / 2 },
              el.rot,
            );
            const cx = drag.fixed.x + cw.x,
              cy = drag.fixed.y + cw.y;
            el.w = nw;
            el.h = nh;
            el.x = cx - nw / 2;
            el.y = cy - nh / 2;
          }
          syncNode(el);
          syncSelBox();
        }
        function endDrag() {
          drag = null;
          window.removeEventListener("pointermove", onMove);
        }

        /* double-click a text element -> jump to editor */
        stage.addEventListener("dblclick", (ev) => {
          const n = ev.target.closest(".el");
          if (!n) return;
          const el = elements.find((e) => e.id === +n.dataset.id);
          if (el && el.type === "text") {
            select(el.id);
            $("tText").focus();
            $("tText").select();
          }
        });

        /* keyboard */
        document.addEventListener("keydown", (ev) => {
          const tag = document.activeElement.tagName;
          if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;
          const el = sel();
          if (!el) return;
          const step = ev.shiftKey ? 10 : 1;
          let used = true;
          switch (ev.key) {
            case "ArrowLeft":
              el.x -= step;
              break;
            case "ArrowRight":
              el.x += step;
              break;
            case "ArrowUp":
              el.y -= step;
              break;
            case "ArrowDown":
              el.y += step;
              break;
            case "Delete":
            case "Backspace":
              deleteSel();
              return;
            default:
              used = false;
          }
          if (used) {
            ev.preventDefault();
            syncNode(el);
            syncSelBox();
          }
        });

        /* ---------- drag & drop files ---------- */
        ["dragenter", "dragover"].forEach((t) =>
          stage.addEventListener(t, (ev) => {
            if ([...ev.dataTransfer.types].includes("Files")) {
              ev.preventDefault();
              stage.classList.add("drop-hint");
            }
          }),
        );
        ["dragleave", "drop"].forEach((t) =>
          stage.addEventListener(t, () => stage.classList.remove("drop-hint")),
        );
        stage.addEventListener("drop", (ev) => {
          ev.preventDefault();
          const pt = stagePt(ev);
          [...ev.dataTransfer.files].forEach((f) => addImageFromFile(f, pt));
        });
        // also allow dropping anywhere in the workspace
        stageWrap.addEventListener("dragover", (ev) => ev.preventDefault());
        stageWrap.addEventListener("drop", (ev) => {
          ev.preventDefault();
          if (ev.target.closest("#stage")) return;
          [...ev.dataTransfer.files].forEach((f) => addImageFromFile(f, null));
        });

        /* ---------- toolbar ---------- */
        $("btnAddImage").addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", () => {
          [...fileInput.files].forEach((f) => addImageFromFile(f, null));
          fileInput.value = "";
        });
        $("btnAddText").addEventListener("click", addText);

        /* ---------- sidebar ---------- */
        function refreshSidebar() {
          const el = sel();
          $("propsEmpty").hidden = !!el;
          $("propsText").hidden = !el || el.type !== "text";
          $("propsImage").hidden = !el || el.type !== "image";
          $("propsCommon").hidden = !el;
          $("propsTitle").textContent = el
            ? el.type === "text"
              ? "Text"
              : "Image"
            : "Selection";
          if (!el) return;
          $("cRot").value = Math.round(el.rot);
          if (el.type === "text") {
            $("tText").value = el.text;
            $("tFont").value = el.fontFamily;
            $("tSize").value = Math.round(el.fontSize);
            $("tColor").value = el.color;
            $("tBold").classList.toggle("on", el.bold);
            $("tItalic").classList.toggle("on", el.italic);
            document
              .querySelectorAll("[data-align]")
              .forEach((b) =>
                b.classList.toggle("on", b.dataset.align === el.align),
              );
          } else {
            $("iOpacity").value = el.opacity * 100;
          }
        }
        function updateTextAndRemeasure(el) {
          const m = measureTextEl(el);
          const cx = el.x + el.w / 2,
            cy = el.y + el.h / 2; // keep centre in place
          el.w = m.w;
          el.h = m.h;
          el.x = cx - m.w / 2;
          el.y = cy - m.h / 2;
          syncNode(el);
          syncSelBox();
        }
        $("tText").addEventListener("input", () => {
          const el = sel();
          if (!el) return;
          el.text = $("tText").value || " ";
          updateTextAndRemeasure(el);
        });
        $("tFont").addEventListener("change", () => {
          const el = sel();
          if (!el) return;
          el.fontFamily = $("tFont").value;
          updateTextAndRemeasure(el);
        });
        $("tSize").addEventListener("input", () => {
          const el = sel();
          if (!el) return;
          const v = parseFloat($("tSize").value);
          if (!v || v < 6) return;
          el.fontSize = v;
          updateTextAndRemeasure(el);
        });
        $("tColor").addEventListener("input", () => {
          const el = sel();
          if (!el) return;
          el.color = $("tColor").value;
          syncNode(el);
        });
        $("tBold").addEventListener("click", () => {
          const el = sel();
          if (!el) return;
          el.bold = !el.bold;
          updateTextAndRemeasure(el);
          refreshSidebar();
        });
        $("tItalic").addEventListener("click", () => {
          const el = sel();
          if (!el) return;
          el.italic = !el.italic;
          updateTextAndRemeasure(el);
          refreshSidebar();
        });
        document.querySelectorAll("[data-align]").forEach((b) =>
          b.addEventListener("click", () => {
            const el = sel();
            if (!el) return;
            el.align = b.dataset.align;
            syncNode(el);
            refreshSidebar();
          }),
        );
        $("iOpacity").addEventListener("input", () => {
          const el = sel();
          if (!el) return;
          el.opacity = $("iOpacity").value / 100;
          syncNode(el);
        });
        $("cRot").addEventListener("input", () => {
          const el = sel();
          if (!el) return;
          el.rot = parseFloat($("cRot").value) || 0;
          syncNode(el);
          syncSelBox();
        });
        $("cRot90").addEventListener("click", () => {
          const el = sel();
          if (!el) return;
          el.rot = ((Math.round(el.rot / 90) * 90 + 90 + 180) % 360) - 180;
          syncNode(el);
          syncSelBox();
          refreshSidebar();
        });
        $("cForward").addEventListener("click", () => reorder(+1));
        $("cBackward").addEventListener("click", () => reorder(-1));
        function reorder(dir) {
          const el = sel();
          if (!el) return;
          const i = elements.indexOf(el),
            j = i + dir;
          if (j < 0 || j >= elements.length) return;
          elements.splice(i, 1);
          elements.splice(j, 0, el);
          elements.forEach(syncNode);
        }
        $("cDup").addEventListener("click", () => {
          const el = sel();
          if (!el) return;
          const copy = Object.assign({}, el, {
            id: ++uid,
            x: el.x + 14,
            y: el.y + 14,
          });
          elements.push(copy);
          buildNode(copy);
          select(copy.id);
        });
        $("cDel").addEventListener("click", deleteSel);
        function deleteSel() {
          const el = sel();
          if (!el) return;
          elements = elements.filter((e) => e !== el);
          removeNode(el.id);
          select(null);
          elements.forEach(syncNode);
        }

        /* ---------- export ---------- */
        $("expInfo").textContent =
          "Cover is " +
          (PT_W / 72).toFixed(2) +
          '" × ' +
          (PT_H / 72).toFixed(2) +
          '" — 300 DPI gives ' +
          Math.round((PT_W / 72) * 300) +
          " × " +
          Math.round((PT_H / 72) * 300) +
          " px.";

        let expFormat = "png";
        document.querySelectorAll("#fmtPng,#fmtPdf").forEach((b) =>
          b.addEventListener("click", () => {
            expFormat = b.dataset.fmt;
            $("fmtPng").classList.toggle("on", expFormat === "png");
            $("fmtPdf").classList.toggle("on", expFormat === "pdf");
            $("btnExport").textContent = "Download " + expFormat.toUpperCase();
            const transparentOpt = document.querySelector(
              "input[name=expMode][value=transparent]",
            );
            transparentOpt.disabled = expFormat === "pdf";
            if (expFormat === "pdf" && transparentOpt.checked) {
              document.querySelector(
                "input[name=expMode][value=white]",
              ).checked = true;
            }
            transparentOpt.closest("label").style.opacity =
              expFormat === "pdf" ? 0.45 : 1;
          }),
        );

        function renderCanvas(mode, dpi) {
          const k = dpi / 72;
          const cv = document.createElement("canvas");
          cv.width = Math.round(PT_W * k);
          cv.height = Math.round(PT_H * k);
          const ctx = cv.getContext("2d");

          if (mode !== "transparent") {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, cv.width, cv.height);
          }
          for (const el of elements) {
            ctx.save();
            ctx.translate((el.x + el.w / 2) * k, (el.y + el.h / 2) * k);
            ctx.rotate((el.rot * Math.PI) / 180);
            if (el.type === "image") {
              ctx.globalAlpha = el.opacity;
              ctx.drawImage(
                el._img,
                (-el.w / 2) * k,
                (-el.h / 2) * k,
                el.w * k,
                el.h * k,
              );
            } else {
              ctx.fillStyle = el.color;
              ctx.font = fontString(el, el.fontSize * k);
              ctx.textBaseline = "alphabetic";
              const lines = el.text.split("\n");
              const lh = el.fontSize * LINE_H * k;
              const ascentPad = el.fontSize * k * 0.95; // approximate first baseline
              for (let i = 0; i < lines.length; i++) {
                let tx;
                if (el.align === "center") {
                  ctx.textAlign = "center";
                  tx = 0;
                } else if (el.align === "right") {
                  ctx.textAlign = "right";
                  tx = (el.w / 2) * k;
                } else {
                  ctx.textAlign = "left";
                  tx = (-el.w / 2) * k;
                }
                ctx.fillText(
                  lines[i],
                  tx,
                  (-el.h / 2) * k + i * lh + ascentPad,
                );
              }
            }
            ctx.restore();
          }
          if (mode === "guides") {
            ctx.globalCompositeOperation = "multiply";
            ctx.drawImage(tplOverlay, 0, 0, cv.width, cv.height);
            ctx.globalCompositeOperation = "source-over";
          }
          return cv;
        }

        function downloadBlob(blob, filename) {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        }

        $("btnExport").addEventListener("click", () => {
          const mode = document.querySelector(
            "input[name=expMode]:checked",
          ).value;
          const dpi = +$("expDpi").value;
          const base = mode === "guides" ? "cover-with-guides" : "cover-design";
          const cv = renderCanvas(mode, dpi);

          if (expFormat === "png") {
            cv.toBlob((blob) => downloadBlob(blob, base + ".png"), "image/png");
          } else {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
              orientation: PT_W >= PT_H ? "landscape" : "portrait",
              unit: "pt",
              format: [PT_W, PT_H],
            });
            const imgData = cv.toDataURL("image/jpeg", 0.95);
            doc.addImage(imgData, "JPEG", 0, 0, PT_W, PT_H);
            doc.save(base + ".pdf");
          }
        });

        layoutStage();
      })();
    </script>
  </body>
</html>
